<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Додати страву - Адмін-панель</title>
    <link href="https://cdn.jsdelivr.5net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 600px;">
        <div class="card shadow p-4 border-0 rounded-4">
            <h2 class="mb-4 text-center">➕ Додати нову страву</h2>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Назва страви</label>
                    <input type="text" name="name" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Вага / Об'єм (наприклад: 300г або 500мл)</label>
                    <input type="text" name="weight" class="form-control" value="300г">
                </div>
                <div class="mb-3">
                    <label class="form-label">Опис</label>
                    <textarea name="description" class="form-control" rows="3"></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">Ціна (грн)</label>
                    <input type="number" step="0.1" name="price" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Категорія</label>
                    <select name="category" class="form-select">
                        <option value="pizza">Піца</option>
                        <option value="sushi">Суші</option>
                        <option value="burgers">Бургери</option>
                        <option value="drinks">Напої</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Посилання на зображення (URL)</label>
                    <input type="text" name="file_name" class="form-control" placeholder="https://...">
                </div>
                <button type="submit" class="btn btn-success w-100 py-2 fw-bold">Зберегти страву</button>
            </form>
            <div class="text-center mt-3">
                <a href="{{ url_for('menu') }}" class="text-decoration-none text-muted">← Назад до меню</a>
            </div>
        </div>
    </div>
</body>
</html>
