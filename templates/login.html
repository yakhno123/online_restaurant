{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-lg border-0 rounded-lg">
                <div class="card-header bg-primary text-white text-center py-3">
                    <h3 class="font-weight-light my-1">Вхід до акаунту</h3>
                </div>
                <div class="card-body p-4">

                    {% with messages = get_flashed_messages(with_categories=true) %}
                      {% if messages %}
                        {% for category, message in messages %}
                          <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                            {{ message }}
                          </div>
                        {% endfor %}
                      {% endif %}
                    {% endwith %}

                    <form method="POST" action="{{ url_for('login') }}">
                        <div class="form-group mb-3">
                            <label for="username" class="form-label font-weight-bold">Логін</label>
                            <input type="text" name="username" id="username" class="form-control" placeholder="Введіть ваш логін" required autofocus>
                        </div>

                        <div class="form-group mb-4">
                            <label for="password" class="form-label font-weight-bold">Пароль</label>
                            <input type="password" name="password" id="password" class="form-control" placeholder="Введіть пароль" required>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-block py-2 font-weight-bold">Увійти</button>
                        </div>
                    </form>
                </div>
                <div class="card-footer text-center py-3 bg-light">
                    <div class="small">
                        Немає акаунту? <a href="{{ url_for('register') }}">Зареєструватися</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
