{% if current_user.is_authenticated and current_user.is_admin %}
  <div class="card bg-dark text-white mb-4 shadow-sm border-warning">
    <div class="card-body d-flex flex-wrap align-items-center justify-content-between gap-2 py-2">
      <span class="fw-bold text-warning">🛠 Панель адміністратора</span>
      <div class="d-flex flex-wrap gap-2">
        <a href="{{ url_for('menu_check') }}" class="btn btn-sm btn-outline-light">📋 Управління меню</a>
        <a href="{{ url_for('add_position') }}" class="btn btn-sm btn-warning text-dark fw-bold">➕ Додати позицію</a>
        <a href="{{ url_for('reservations_check') }}" class="btn btn-sm btn-outline-light">🪑 Бронювання</a>
        <a href="{{ url_for('all_users') }}" class="btn btn-sm btn-outline-light">👥 Користувачі</a>
      </div>
    </div>
  </div>
{% endif %}
